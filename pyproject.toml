[project]
name = "pytemplate"
version = "0.4.0"
description = "Python Template System - Make projects with prebuilt templates"
readme = "README.md"
authors = [
    {name = "radin6262", email = "none@gmail.com"}
]
license = {text = "MIT"}
requires-python = ">=3.8"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Code Generators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "click>=8.0.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
]

[project.scripts]
pytemplate = "pytemplate.cli:main"

[project.urls]
Homepage = "https://github.com/yourusername/pytemplate"
Repository = "https://github.com/yourusername/pytemplate"
Issues = "https://github.com/yourusername/pytemplate/issues"